name: Release — Build, Push ECR, Deploy ECS

# Triggered on semantic version tags: v1.0.0, v2.3.1, etc.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  id-token: write   # Required for OIDC-based AWS auth (no long-lived keys)
  contents: read

env:
  AWS_REGION: sa-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.sa-east-1.amazonaws.com
  ECR_REPOSITORY: crm-dermacells-api
  ECS_CLUSTER: crm-dermacells
  # Separate ECS services for web, horizon, and reverb
  ECS_SERVICE_WEB: crm-dermacells-web
  ECS_SERVICE_HORIZON: crm-dermacells-horizon
  ECS_SERVICE_REVERB: crm-dermacells-reverb
  TF_WORKING_DIR: infra/terraform/ecs
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build and push Docker image to ECR
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build Docker image and push to ECR
    runs-on: ubuntu-latest

    outputs:
      image-uri: ${{ steps.push.outputs.image-uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ env.IMAGE_TAG }}

      - name: Output image URI
        run: |
          echo "image-uri=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. Terraform plan (generates execution plan, stored as artifact)
  # ---------------------------------------------------------------------------
  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production   # Requires approval in GitHub Environments settings

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: |
          terraform plan \
            -input=false \
            -out=tfplan \
            -var="image_tag=${{ env.IMAGE_TAG }}" \
            -var="app_image_uri=${{ needs.build-and-push.outputs.image-uri }}"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.IMAGE_TAG }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Terraform apply — requires second approver in GitHub Environments
  # ---------------------------------------------------------------------------
  terraform-apply:
    name: Terraform apply (production deploy)
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: production-apply   # Configure with required reviewers in GitHub Settings > Environments

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.IMAGE_TAG }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Wait for ECS services to stabilise
        run: |
          for SERVICE in "${{ env.ECS_SERVICE_WEB }}" "${{ env.ECS_SERVICE_HORIZON }}" "${{ env.ECS_SERVICE_REVERB }}"; do
            echo "Waiting for ECS service: $SERVICE"
            aws ecs wait services-stable \
              --cluster "${{ env.ECS_CLUSTER }}" \
              --services "$SERVICE" \
              --region "${{ env.AWS_REGION }}"
          done
          echo "All ECS services are stable."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Docker image:** `${{ needs.build-and-push.outputs.image-uri }}`
            **ECS cluster:** `${{ env.ECS_CLUSTER }}` (sa-east-1)
            **Services updated:** web, horizon, reverb
